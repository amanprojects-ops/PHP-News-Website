<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- News Icon Symbol -->
  <rect x="5" y="10" width="38" height="40" rx="8" fill="url(#logoGrad)" />
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="20" height="24" rx="2" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="4" y1="6" x2="16" y2="6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="4" y1="11" x2="16" y2="11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="4" y1="16" x2="12" y2="16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  </g>
  <!-- Text Brand -->
  <text x="54" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">NEWS<tspan fill="#1e90ff">PORTAL</tspan></text>
  <text x="55" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1.5">DAILY INSIGHTS</text>
</svg>
