<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="accentGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="400" cy="200" r="240" fill="url(#accentGlow)" />

  <!-- Center Decorative Icon Container -->
  <g transform="translate(400, 195)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="54" fill="rgba(30, 144, 255, 0.08)" stroke="rgba(30, 144, 255, 0.3)" stroke-width="1.5" />
    
    <!-- Modern Newspaper / Article Icon -->
    <g transform="translate(-24, -26)">
      <!-- Newspaper Paper Base -->
      <rect x="0" y="4" width="48" height="42" rx="5" fill="none" stroke="#60a5fa" stroke-width="2.5" />
      <!-- Top Fold / Header Bar -->
      <path d="M 0 14 L 48 14" stroke="#60a5fa" stroke-width="2" />
      <!-- Article Headline block -->
      <rect x="7" y="19" width="16" height="12" rx="2" fill="rgba(96, 165, 250, 0.4)" />
      <!-- Article Text lines -->
      <line x1="27" y1="21" x2="41" y2="21" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="27" y1="27" x2="38" y2="27" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="7" y1="36" x2="41" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="7" y1="41" x2="28" y2="41" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Text Badge -->
  <g transform="translate(400, 285)">
    <!-- Pill Badge -->
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="rgba(30, 144, 255, 0.15)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1" />
    <text x="0" y="4" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.5" text-anchor="middle">EARN BRO</text>
  </g>
</svg>
